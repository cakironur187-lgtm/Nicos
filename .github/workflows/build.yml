name: build
on: [push, workflow_dispatch]
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - run: unzip SesliAsistan.zip
      - run: cd SesliAsistan && gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: nico-apk
          path: SesliAsistan/app/build/outputs/apk/debug/app-debug.apk
